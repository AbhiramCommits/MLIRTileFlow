name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "23"
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}" all
          sudo apt-get update
          sudo apt-get install -y \
            "libmlir-${LLVM_VERSION}-dev" \
            "mlir-${LLVM_VERSION}-tools" \
            "llvm-${LLVM_VERSION}-dev" \
            "clang-${LLVM_VERSION}" \
            ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lit pytest numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/mlir \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: |
          mkdir -p results
          ctest --test-dir build --output-on-failure | tee results/test_output.txt

      - name: Small benchmark
        run: TILEFLOW_BENCH_QUICK=1 python bench/run_bench.py

      - name: GPU status
        run: python bench/run_bench_gpu.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
